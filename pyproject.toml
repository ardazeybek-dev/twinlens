[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinlens"
version = "0.1.0"
description = "Find near-duplicate photos, keep the best shot, and clean up safely with an undoable plan."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arda Zeybek" }]
keywords = ["photos", "duplicates", "perceptual-hash", "phash", "bk-tree", "deduplication", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
  "Topic :: System :: Filesystems",
]
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
twinlens = "twinlens.cli:main"

[project.urls]
Homepage = "https://github.com/ardazeybek-dev/twinlens"
Demo = "https://ardazeybek-dev.github.io/twinlens/"
Issues = "https://github.com/ardazeybek-dev/twinlens/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twinlens = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
