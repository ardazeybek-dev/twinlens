<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twinlens report</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='8' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3Ccircle cx='20' cy='16' r='8' fill='none' stroke='%23a78bfa' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0d12; --bg-2: #11141b; --panel: #151924; --panel-2: #1b2030; --line: #262c3d;
  --text: #e7e9ef; --muted: #8b93a7; --faint: #5d6478;
  --cyan: #22d3ee; --violet: #a78bfa; --green: #34d399; --rose: #fb7185; --amber: #fbbf24;
  --grad: linear-gradient(135deg, var(--cyan), var(--violet));
  --radius: 14px; --shadow: 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f6f7fb; --bg-2: #eef0f6; --panel: #ffffff; --panel-2: #f3f4f9; --line: #e2e5ee;
  --text: #151824; --muted: #5b6275; --faint: #8b91a3;
  --cyan: #0891b2; --violet: #7c3aed; --green: #059669; --rose: #e11d48; --amber: #d97706;
  --shadow: 0 8px 24px rgba(20,24,40,.08);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
  background: radial-gradient(900px 500px at 10% -10%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 60%),
              radial-gradient(900px 500px at 100% 0%, color-mix(in srgb, var(--violet) 14%, transparent), transparent 60%);
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
header.top { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(14px);
  background: color-mix(in srgb, var(--bg) 78%, transparent); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; align-items: center; gap: 16px; height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-weight: 500; font-size: 13px; }
.spacer { flex: 1; }
button, .btn {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 14px; cursor: pointer; transition: .15s; white-space: nowrap;
}
button:hover { border-color: color-mix(in srgb, var(--cyan) 50%, var(--line)); }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.btn-primary { background: var(--grad); color: #0b0d12; border: 0; font-weight: 650; }
.btn-primary:hover { filter: brightness(1.08); }
.icon-btn { padding: 8px 10px; }

.hero { padding: 36px 0 18px; }
.hero h1 { margin: 0 0 6px; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.03em; line-height: 1.15; }
.hero h1 .g { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero p { margin: 0; color: var(--muted); }
.roots { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--muted);
  padding: 6px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 22px 0 10px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.stat .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.stat .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat.hl { border-color: color-mix(in srgb, var(--green) 45%, var(--line)); }
.stat.hl .v { color: var(--green); }

.meter { margin: 14px 0 6px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; }
.meter .bar { height: 12px; border-radius: 999px; background: var(--panel-2); overflow: hidden; display: flex; margin-top: 10px; }
.meter .bar span { display: block; height: 100%; }
.meter .legend { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 22px 0 14px; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.search { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 11px; padding: 0 12px; }
.search input { flex: 1; border: 0; background: transparent; color: var(--text); font: inherit; padding: 9px 0; outline: none; }
select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 8px 10px; }

.cluster { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 16px; box-shadow: var(--shadow); overflow: hidden; }
.cluster > .head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.cluster .title { font-weight: 650; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; }
.tag.exact { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
.tag.similar { color: var(--cyan); background: color-mix(in srgb, var(--cyan) 14%, transparent); }
.save { margin-left: auto; color: var(--green); font-weight: 650; font-variant-numeric: tabular-nums; }
.warn { color: var(--rose); font-size: 13px; font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; padding: 16px 18px 18px; }
.ph { position: relative; border-radius: 12px; background: var(--bg-2); border: 1px solid var(--line); overflow: hidden; transition: .18s; }
.ph.keep { border-color: color-mix(in srgb, var(--green) 70%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--green) 50%, transparent); }
.ph.remove .imgbox img { filter: grayscale(.65) brightness(.75); }
.imgbox { position: relative; aspect-ratio: 4/3; background: repeating-conic-gradient(var(--panel-2) 0 25%, var(--bg-2) 0 50%) 0 0/16px 16px; cursor: zoom-in; }
.imgbox img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter .2s; }
.badge { position: absolute; top: 9px; left: 9px; font-size: 11px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase;
  padding: 5px 8px; border-radius: 7px; backdrop-filter: blur(6px); }
.keep .badge { background: color-mix(in srgb, var(--green) 85%, black); color: #04150e; }
.remove .badge { background: rgba(10,12,18,.72); color: #fda4af; border: 1px solid rgba(251,113,133,.4); }
.dist { position: absolute; top: 9px; right: 9px; font: 11px/1 ui-monospace, Consolas, monospace; padding: 5px 7px; border-radius: 7px; background: rgba(10,12,18,.66); color: #cbd5e1; }
.meta { padding: 10px 12px 12px; }
.name { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dir { color: var(--faint); font: 11.5px/1.4 ui-monospace, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.facts b { color: var(--text); font-weight: 600; }
.facts > span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sharp { height: 4px; border-radius: 99px; background: var(--panel-2); margin-top: 3px; overflow: hidden; }
.sharp i { display: block; height: 100%; background: var(--grad); }
.reasons { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.reasons span { font-size: 11px; padding: 3px 7px; border-radius: 6px; background: color-mix(in srgb, var(--green) 12%, transparent); color: var(--green); }
.actions { display: flex; gap: 6px; margin-top: 10px; }
.actions button { flex: 1; padding: 6px 8px; font-size: 12.5px; }
.empty { text-align: center; color: var(--muted); padding: 60px 0; }

dialog { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 18px; padding: 0; width: min(1100px, 94vw); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
dialog::backdrop { background: rgba(5,6,10,.72); backdrop-filter: blur(4px); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.compare { position: relative; aspect-ratio: 4/3; max-height: 72vh; margin: 0 auto; overflow: hidden; background: #000; user-select: none; touch-action: none; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.compare .top { clip-path: inset(0 calc(100% - var(--pos, 50%)) 0 0); }
.compare .handle { position: absolute; top: 0; bottom: 0; left: var(--pos, 50%); width: 2px; background: #fff; transform: translateX(-1px); cursor: ew-resize; }
.compare .handle::after { content: "⇆"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%;
  background: #fff; color: #111; display: grid; place-items: center; font-size: 18px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
.compare .lbl { position: absolute; bottom: 12px; font-size: 12px; font-weight: 650; padding: 5px 9px; border-radius: 7px; background: rgba(0,0,0,.65); color: #fff; }
.dlg-foot { display: flex; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; flex-wrap: wrap; }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .25s; z-index: 50;
  background: var(--panel-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
footer { color: var(--faint); font-size: 13px; text-align: center; padding: 30px 0 50px; }
footer code { font-family: ui-monospace, Consolas, monospace; color: var(--muted); }
@media (max-width: 640px) {
  .wrap { padding: 0 16px; }
  header.top .brand small { display: none; }
  .grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .facts { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><circle cx="12" cy="16" r="8" fill="none" stroke="#22d3ee" stroke-width="3"/><circle cx="20" cy="16" r="8" fill="none" stroke="url(#lg)" stroke-width="3"/></svg>
      twinlens <small id="gen"></small>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
    <button class="btn-primary" id="export">Export plan<span class="hide-sm"> (.json)</span></button>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Found <span class="g" id="h-dupes">0 twins</span> you can safely clear</h1>
    <p id="h-sub"></p>
    <div class="roots" id="roots"></div>
  </section>

  <section class="stats" id="stats"></section>
  <section class="meter" id="meter"></section>

  <section class="toolbar">
    <div class="seg" role="group" aria-label="Filter">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="similar" aria-pressed="false">Similar</button>
      <button data-f="exact" aria-pressed="false">Exact</button>
    </div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Filter by file name or folder…"></label>
    <select id="sort" aria-label="Sort">
      <option value="space">Most space first</option>
      <option value="size">Largest group first</option>
      <option value="name">By folder</option>
    </select>
    <button id="reset" title="Restore the automatic keeper choice">Reset picks</button>
  </section>

  <section id="list"></section>
</main>

<footer class="wrap">
  Nothing has been moved yet. Review the picks, then <b>Export plan</b> and run
  <code>twinlens apply plan.json</code> — files go to a quarantine folder and <code>twinlens undo</code> puts them back.
</footer>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlg-title">Compare</b><span class="spacer"></span><button id="dlg-close" aria-label="Close">✕</button></div>
  <div class="compare" id="cmp">
    <img id="cmp-a" alt=""><img id="cmp-b" class="top" alt="">
    <div class="handle"></div>
    <span class="lbl" style="left:12px" id="cmp-lb"></span><span class="lbl" style="right:12px" id="cmp-la"></span>
  </div>
  <div class="dlg-foot" id="dlg-foot"></div>
</dialog>
<div class="toast" id="toast"></div>

<script id="twinlens-data" type="application/json">__TWINLENS_DATA__</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById("twinlens-data").textContent);
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmtBytes = (n) => { const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 2 : 1) : n) + " " + u[i]; };
  const fmtNum = (n) => n.toLocaleString("en-US");
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  // theme
  const root = document.documentElement;
  const saved = store.get("twinlens-theme");
  if (saved) root.dataset.theme = saved;
  else if (matchMedia("(prefers-color-scheme: light)").matches) root.dataset.theme = "light";
  $("#theme").onclick = () => { root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light"; store.set("twinlens-theme", root.dataset.theme); };

  const S = DATA.summary;
  $("#gen").textContent = "v" + DATA.version + " · " + new Date(S.created).toLocaleString();
  $("#roots").innerHTML = S.roots.map((r) => `<span class="chip">${esc(r)}</span>`).join("");

  // state: keep flags per member, persisted per report
  const KEY = "twinlens-picks-" + S.created;
  const defaults = DATA.clusters.map((c) => c.members.map((m) => m.keep));
  let picks = (() => { try { const p = JSON.parse(store.get(KEY)); if (p && p.length === defaults.length) return p; } catch {} return defaults.map((a) => a.slice()); })();
  const persist = () => store.set(KEY, JSON.stringify(picks));

  let filter = "all", query = "", sort = "space";
  const totals = () => {
    let bytes = 0, files = 0, broken = 0;
    DATA.clusters.forEach((c, ci) => {
      const keepCount = picks[ci].filter(Boolean).length;
      if (!keepCount) broken++;
      c.members.forEach((m, mi) => { if (!picks[ci][mi]) { bytes += m.size; files++; } });
    });
    return { bytes, files, broken };
  };

  function renderSummary() {
    const t = totals();
    $("#h-dupes").textContent = fmtNum(t.files) + (t.files === 1 ? " twin" : " twins");
    $("#h-sub").textContent = `${fmtNum(S.photos)} photos scanned in ${S.seconds.toFixed(1)} s · ${fmtNum(DATA.clusters.length)} groups · threshold ${S.threshold}/64 · ${fmtNum(S.comparisons)} hash comparisons instead of ${fmtNum(S.naive_comparisons)}`;
    const stats = [
      ["Photos scanned", fmtNum(S.photos)],
      ["Twin groups", fmtNum(DATA.clusters.length)],
      ["Marked to remove", fmtNum(t.files)],
      ["Space to reclaim", fmtBytes(t.bytes), "hl"],
      ["Library size", fmtBytes(S.bytes)],
    ];
    $("#stats").innerHTML = stats.map(([k, v, c]) => `<div class="stat ${c || ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
    const keepBytes = S.bytes - t.bytes;
    const pct = (n) => (S.bytes ? (100 * n) / S.bytes : 0).toFixed(2) + "%";
    $("#meter").innerHTML = `<div class="legend">
        <span><i class="dot" style="background:var(--violet)"></i>Kept · ${fmtBytes(keepBytes)}</span>
        <span><i class="dot" style="background:var(--green)"></i>Reclaimable · ${fmtBytes(t.bytes)} (${pct(t.bytes)})</span>
        ${S.errors ? `<span><i class="dot" style="background:var(--rose)"></i>${S.errors} unreadable file(s) skipped</span>` : ""}
      </div>
      <div class="bar"><span style="width:${pct(keepBytes)};background:var(--violet)"></span><span style="width:${pct(t.bytes)};background:var(--green)"></span></div>`;
  }

  function memberCard(c, ci, m, mi) {
    const keep = picks[ci][mi];
    const maxSharp = Math.max(...c.members.map((x) => x.sharpness)) || 1;
    return `<article class="ph ${keep ? "keep" : "remove"}" data-ci="${ci}" data-mi="${mi}">
      <div class="imgbox" data-act="compare" title="Compare with the keeper"><img loading="lazy" src="${m.thumb}" alt="${esc(m.name)}">
        <span class="badge">${keep ? "Keep" : "Remove"}</span>${mi === c.best ? "" : `<span class="dist" title="pHash distance to the suggested keeper">Δ ${m.distance}</span>`}</div>
      <div class="meta">
        <div class="name" title="${esc(m.path)}">${esc(m.name)}</div>
        <div class="dir" title="${esc(m.dir)}">${esc(m.dir)}</div>
        <div class="facts">
          <span><b>${m.width}×${m.height}</b></span><span><b>${fmtBytes(m.size)}</b></span>
          <span>${m.taken ? esc(m.taken.replace("T", " ").slice(0, 16)) : "no EXIF date"}</span>
          <span title="Laplacian variance">sharp ${Math.round(m.sharpness)}<div class="sharp"><i style="width:${(100 * m.sharpness) / maxSharp}%"></i></div></span>
        </div>
        ${m.reasons.length ? `<div class="reasons">${m.reasons.map((r) => `<span>${esc(r)}</span>`).join("")}</div>` : ""}
        <div class="actions"><button data-act="toggle">${keep ? "Mark remove" : "Keep this"}</button>${keep ? "" : `<button data-act="only">Keep only this</button>`}</div>
      </div></article>`;
  }

  function renderList() {
    let rows = DATA.clusters.map((c, ci) => ({ c, ci }));
    if (filter !== "all") rows = rows.filter((r) => r.c.kind === filter);
    if (query) rows = rows.filter((r) => r.c.members.some((m) => m.path.toLowerCase().includes(query)));
    const saving = (r) => r.c.members.reduce((s, m, mi) => s + (picks[r.ci][mi] ? 0 : m.size), 0);
    if (sort === "space") rows.sort((a, b) => saving(b) - saving(a));
    if (sort === "size") rows.sort((a, b) => b.c.members.length - a.c.members.length);
    if (sort === "name") rows.sort((a, b) => a.c.members[0].dir.localeCompare(b.c.members[0].dir));
    if (!rows.length) { $("#list").innerHTML = `<div class="empty">${DATA.clusters.length ? "No groups match this filter." : "🎉 No duplicates found — this library is already clean."}</div>`; return; }
    $("#list").innerHTML = rows.map(({ c, ci }) => {
      const keepCount = picks[ci].filter(Boolean).length;
      return `<section class="cluster" data-ci="${ci}">
        <div class="head"><span class="title">Group ${c.id}</span><span class="tag ${c.kind}">${c.kind}</span>
          <span style="color:var(--muted);font-size:13px">${c.members.length} photos</span>
          ${keepCount ? "" : `<span class="warn">⚠ nothing kept — this group will be skipped</span>`}
          <span class="save">−${fmtBytes(saving({ c, ci }))}</span></div>
        <div class="grid">${c.members.map((m, mi) => memberCard(c, ci, m, mi)).join("")}</div></section>`;
    }).join("");
  }
  const render = () => { renderSummary(); renderList(); };

  $("#list").addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const card = el.closest(".ph"); const ci = +card.dataset.ci, mi = +card.dataset.mi;
    if (el.dataset.act === "toggle") picks[ci][mi] = !picks[ci][mi];
    if (el.dataset.act === "only") picks[ci] = picks[ci].map((_, k) => k === mi);
    if (el.dataset.act === "compare") return openCompare(ci, mi);
    persist(); render();
  });
  document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => {
    filter = b.dataset.f; document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b)); renderList();
  });
  $("#q").oninput = (e) => { query = e.target.value.trim().toLowerCase(); renderList(); };
  $("#sort").onchange = (e) => { sort = e.target.value; renderList(); };
  $("#reset").onclick = () => { picks = defaults.map((a) => a.slice()); persist(); render(); toast("Restored the automatic picks"); };

  // compare dialog with a draggable before/after slider
  const dlg = $("#dlg"), cmp = $("#cmp");
  function openCompare(ci, mi) {
    const c = DATA.clusters[ci], m = c.members[mi];
    const kIdx = picks[ci].indexOf(true) >= 0 && picks[ci].indexOf(true) !== mi ? picks[ci].indexOf(true) : (c.best !== mi ? c.best : (mi + 1) % c.members.length);
    const k = c.members[kIdx];
    $("#cmp-a").src = k.thumb; $("#cmp-b").src = m.thumb;
    $("#cmp-lb").textContent = m.name; $("#cmp-la").textContent = k.name;
    $("#dlg-title").textContent = `Group ${c.id} · drag to compare`;
    $("#dlg-foot").innerHTML = `<span><b>${esc(m.name)}</b> ${m.width}×${m.height}, ${fmtBytes(m.size)}, sharpness ${Math.round(m.sharpness)}</span><span class="spacer"></span><span><b>${esc(k.name)}</b> ${k.width}×${k.height}, ${fmtBytes(k.size)}, sharpness ${Math.round(k.sharpness)}</span>`;
    cmp.style.setProperty("--pos", "50%"); dlg.showModal();
  }
  const move = (x) => { const r = cmp.getBoundingClientRect(); cmp.style.setProperty("--pos", Math.min(100, Math.max(0, ((x - r.left) / r.width) * 100)) + "%"); };
  let drag = false;
  cmp.addEventListener("pointerdown", (e) => { drag = true; cmp.setPointerCapture(e.pointerId); move(e.clientX); });
  cmp.addEventListener("pointermove", (e) => drag && move(e.clientX));
  cmp.addEventListener("pointerup", () => (drag = false));
  $("#dlg-close").onclick = () => dlg.close();
  dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

  // export the (possibly edited) plan in the exact format `twinlens apply` reads
  $("#export").onclick = () => {
    const plan = Object.assign({}, DATA.plan, {
      created: new Date().toISOString(), edited_in_report: true,
      clusters: DATA.clusters.map((c, ci) => ({
        id: c.id, kind: c.kind,
        keep: c.members.filter((_, mi) => picks[ci][mi]).map((m) => m.path),
        remove: c.members.filter((_, mi) => !picks[ci][mi]).map((m) => ({ path: m.path, size: m.size, sha: m.sha })),
      })),
    });
    const url = URL.createObjectURL(new Blob([JSON.stringify(plan, null, 2)], { type: "application/json" }));
    const a = Object.assign(document.createElement("a"), { href: url, download: "plan.json" });
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
    const t = totals();
    toast(`plan.json saved · ${t.files} files, ${fmtBytes(t.bytes)}${t.broken ? ` · ${t.broken} group(s) with no keeper will be skipped` : ""}`);
  };
  let toastTimer;
  function toast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 3200); }

  render();
})();
</script>
</body>
</html>
